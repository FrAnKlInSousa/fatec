<div class="container my-4">
  <h2 class="mb-4">Cesta de compras</h2>

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Produto</th>
          <th>Preço unitário</th>
          <th>Quantidade</th>
          <th>Subtotal</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of cesta.itens">
          <td>
            <strong>{{ item.produto.nome }}</strong>
            <br>
            <small class="text-muted">
              {{ item.produto.descritivo }}
            </small>
          </td>

          <td>
            {{ item.produto.valorPromo | currency:'BRL' }}
          </td>

          <td>
            {{ item.quantidade }}
          </td>

          <td>
            {{ item.subtotal | currency:'BRL' }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-end">
    <div class="card p-3">
      <h5 class="mb-0">
        Total:
        {{ cesta.total | currency:'BRL' }}
      </h5>
    </div>
  </div>
</div>
